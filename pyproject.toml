[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "faceswap-studio"
version = "0.1.0"
description = "Swap your own and your friends' faces into movie scenes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gradio>=4.44",
    "insightface>=0.7.3",
    "numpy",
    "onnx",
    "opencv-python",
]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu"]
cpu = ["onnxruntime"]
dev = ["pytest"]

[project.scripts]
faceswap-studio = "faceswap_studio.app:main"

[tool.setuptools]
packages = ["faceswap_studio"]
